
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>CyberNest AI</title>
<style>
*{box-sizing:border-box}
body{
 margin:0;background:#050b1b;color:white;
 font-family:Arial,sans-serif;
}
header{
 padding:25px 15px;text-align:center;
 background:linear-gradient(120deg,#101c42,#24104b);
 border-bottom:1px solid #315aff;
}
.logo{font-size:48px}
header h1{
 margin:8px;color:#70aaff;
 font-size:32px;
}
header p{color:#b8c7ef}
.container{
 max-width:750px;margin:25px auto;padding:15px;
}
.card{
 background:#101a33;border:1px solid #315aff;
 border-radius:20px;padding:18px;
 box-shadow:0 0 20px #1239aa55;
}
.welcome{
 text-align:center;padding:15px;
}
.welcome h2{color:#80aaff}
#messages{
 height:48vh;min-height:300px;
 overflow-y:auto;padding:12px;
 background:#080f22;border-radius:14px;
}
.msg{
 padding:13px 15px;margin:12px 0;
 border-radius:14px;max-width:88%;
 line-height:1.5;overflow-wrap:anywhere;
}
.bot{background:#23375f}
.user{background:#315fc4;margin-left:auto}
.controls{
 display:flex;gap:8px;margin-top:15px;
}
input{
 flex:1;min-width:0;padding:15px;
 border-radius:12px;border:1px solid #527eff;
 background:#172747;color:white;font-size:16px;
}
button{
 border:0;border-radius:12px;padding:13px 17px;
 background:linear-gradient(120deg,#168cff,#8c42ff);
 color:white;font-weight:bold;font-size:15px;
}
button:active{opacity:.8}
.quick{
 display:flex;gap:8px;flex-wrap:wrap;
 margin-top:14px;
}
.quick button{
 background:#1b2b50;border:1px solid #4268c9;
 font-size:13px;
}
footer{
 text-align:center;color:#899ac2;
 padding:25px;font-size:13px;
}
</style>
</head>
<body>

<header>
 <div class="logo">🤖</div>
 <h1>CyberNest AI</h1>
 <p>Think • Learn • Grow Together 🚀</p>
</header>

<div class="container">
 <div class="card">
  <div class="welcome">
   <h2>👋 Welcome to CyberNest!</h2>
   <p>Your Smart AI Assistant</p>
  </div>

  <div id="messages">
   <div class="msg bot">
    Hello! 👋 I am CyberNest AI.<br>
    नमस्ते! मैं तुम्हारा AI Assistant हूँ।<br>
    Ask me something!
   </div>
  </div>

  <div class="controls">
   <input id="question" placeholder="Ask me anything..."
   onkeydown="if(event.key==='Enter')send()">
   <button onclick="send()">Send ➤</button>
  </div>

  <div class="quick">
   <button onclick="ask('What is AI?')">🤖 What is AI?</button>
   <button onclick="ask('Tell me a fun fact')">💡 Fun Fact</button>
   <button onclick="ask('Help me study')">📚 Study Help</button>
  </div>
 </div>
</div>

<footer>
 © 2026 CyberNest AI<br>
 Powered by Innovation 🚀
</footer>

<script>
function ask(text){
 document.getElementById("question").value=text;
 send();
}

function send(){
 const input=document.getElementById("question");
 const q=input.value.trim();
 if(!q)return;

 const box=document.getElementById("messages");

 const user=document.createElement("div");
 user.className="msg user";
 user.textContent=q;
 box.appendChild(user);

 const bot=document.createElement("div");
 bot.className="msg bot";

 let answer="I am CyberNest AI demo. Real AI connection is coming soon! 🚀";

 const s=q.toLowerCase();

 if(s.includes("hello")||s.includes("hi")||s.includes("नमस्ते")){
 answer="Hello! 👋 Welcome to CyberNest AI. How can I help you?";
 }
 else if(s.includes("what is ai")||s.includes("ai kya")){
 answer="AI का पूरा नाम Artificial Intelligence है। यह ऐसी तकनीक है जो कंप्यूटर को सीखने और सवालों के जवाब देने जैसे काम करने में मदद करती है। 🤖";
 }
 else if(s.includes("study")||s.includes("पढ़ाई")){
 answer="पढ़ाई में मैं तुम्हारी मदद कर सकता हूँ! 📚 अपना विषय और सवाल बताओ।";
 }
 else if(s.includes("fun fact")){
 answer="Fun Fact! 🧠 इंसानी दिमाग और AI दोनों जानकारी को अलग-अलग तरीकों से प्रोसेस करते हैं!";
 }
 else if(s.includes("who are you")||s.includes("tum kaun")){
 answer="मैं CyberNest AI हूँ! तुम्हारा स्मार्ट डिजिटल असिस्टेंट। 🚀";
 }

 bot.textContent=answer;
 box.appendChild(bot);
 input.value="";
 box.scrollTop=box.scrollHeight;
}
</script>
</body>
</html>
